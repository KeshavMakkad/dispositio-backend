replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "17.10"

serviceAccount:
  create: true
  automount: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 5432

ingress:
  enabled: false

httpRoute:
  enabled: false

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_USER
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_PASSWORD
  - name: POSTGRES_DB
    value: dispositio
  - name: PGDATA
    value: /var/lib/postgresql/data/pgdata

startupProbe:
  exec:
    command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
  periodSeconds: 2
  failureThreshold: 60

livenessProbe:
  exec:
    command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]

readinessProbe:
  exec:
    command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]

terminationGracePeriodSeconds: 60

volumeMounts:
  - name: data
    mountPath: /var/lib/postgresql/data

volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
