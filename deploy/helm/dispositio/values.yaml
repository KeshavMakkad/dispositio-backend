replicaCount: 1

image:
  repository: dispositio-backend
  pullPolicy: IfNotPresent
  tag: local

serviceAccount:
  create: true
  automount: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: dispositio.localhost
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dispositio-tls
      hosts:
        - dispositio.localhost

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http

readinessProbe:
  httpGet:
    path: /healthz
    port: http

lifecycle:
  preStop:
    exec:
      command: ["sleep", "5"]

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

migrations:
  enabled: true
  command: ["alembic", "-c", "src/alembic/alembic.ini", "upgrade", "head"]

config:
  LOG_LEVEL: info
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: dispositio
  DB_SCHEMA: public
  CREATE_MODELS: "false"
  COOKIE_SECURE: "true"

existingSecret: dispositio-secrets

secretEnv:
  - name: DB_USER
  - name: DB_PASSWORD
  - name: JWT_SECRET
  - name: SHEETS_API_KEY
    optional: true
  - name: SUPABASE_JWT_SECRET
    optional: true
