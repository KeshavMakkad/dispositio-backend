replicaCount: 2

image:
  repository: ghcr.io/keshavmakkad/dispositio-backend

config:
  ENVIRONMENT: prod
  LOG_LEVEL: info

autoscaling:
  enabled: true

podDisruptionBudget:
  enabled: true

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: dispositio
        app.kubernetes.io/instance: dispositio
