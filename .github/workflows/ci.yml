name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/keshavmakkad/dispositio-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select E9,F63,F7,F82 --exclude src/alembic/versions src tests
      - run: pytest -q tests/test_classroom_api_contract.py
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test
          DB_USER: test
          DB_SCHEMA: public
          CREATE_MODELS: "false"
          JWT_SECRET: ci-only-not-a-secret

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - run: bandit -r src -ll -s B104 -x src/alembic
      - run: pip-audit -r requirements.txt --strict

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - run: |
          helm lint deploy/helm/postgres --strict
          for env in development production; do
            helm lint deploy/helm/dispositio -f deploy/helm/dispositio/values-$env.yaml --strict
          done

  build:
    needs: [test, security, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build image tagged with the commit SHA
        run: |
          docker build -t "$IMAGE_REPO:$TAG" --build-arg GIT_SHA="$TAG" .
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save "$IMAGE_REPO:$TAG" | gzip > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE_REPO:${GITHUB_SHA::7}"
